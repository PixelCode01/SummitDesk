{% extends 'base.html' %}

{% block title %}Delete Trek | SummitDesk{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h1 class="h4">Delete {{ trek.name }}?</h1>
                <p class="text-muted">This will also remove bookings attached to this trek.</p>
                <form method="POST" action="{{ url_for('admin.trek_delete', trek_id=trek.id) }}" class="d-inline">
                    <button class="btn btn-danger" type="submit">Yes, Delete Trek</button>
                </form>
                <a class="btn btn-outline-secondary" href="{{ url_for('admin.treks') }}">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
