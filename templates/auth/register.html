{% extends 'base.html' %}

{% block title %}Register | SummitDesk{% endblock %}

{% block content %}
<div class="row g-0 shadow-sm rounded overflow-hidden border" style="max-width: 900px; margin: 2rem auto; background-color: var(--bg-surface); border-color: var(--border-color) !important;">
    <div class="col-md-6 d-none d-md-block p-0">
        <img src="{{ url_for('static', filename='img/register_bg.png') }}" class="w-100 h-100" style="object-fit: cover; min-height: 600px;" alt="Trekking Valley">
    </div>
    <div class="col-md-6">
        <div class="p-4 p-md-5">
            <h1 class="h3 mb-4">Create Account</h1>
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" minlength="2" maxlength="120" required>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" minlength="3" maxlength="80" required>
                    </div>
                    <div class="col-6">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone" maxlength="20">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" maxlength="120" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                </div>
                <div class="mb-4">
                    <label for="role" class="form-label">Account Type</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="trekker">Trekker</option>
                        <option value="staff">Trek Staff</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
            </form>
            <p class="text-muted small mb-0 text-center">
                Already registered? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-medium" style="color: var(--accent-forest);">Login here</a>.
            </p>
        </div>
    </div>
</div>
{% endblock %}
