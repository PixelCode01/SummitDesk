{% extends 'base.html' %}

{% block title %}Login | SummitDesk{% endblock %}

{% block content %}
<div class="row g-0 shadow-sm rounded overflow-hidden border" style="max-width: 900px; margin: 2rem auto; background-color: var(--bg-surface); border-color: var(--border-color) !important;">
    <div class="col-md-6 d-none d-md-block p-0">
        <img src="{{ url_for('static', filename='img/login_bg.png') }}" class="w-100 h-100" style="object-fit: cover; min-height: 500px;" alt="Misty Mountains">
    </div>
    <div class="col-md-6">
        <div class="p-4 p-md-5">
            <h1 class="h3 mb-4">Welcome Back</h1>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" minlength="3" maxlength="80" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" value="" id="remember" name="remember">
                    <label class="form-check-label text-muted" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            </form>
            <p class="text-muted small mb-0 text-center">
                New here? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-medium" style="color: var(--accent-forest);">Create an account</a>.
            </p>
        </div>
    </div>
</div>
{% endblock %}
