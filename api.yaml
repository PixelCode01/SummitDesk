openapi: 3.0.0
info:
  title: SummitDesk API
  description: API for managing treks, bookings, and users in the SummitDesk application.
  version: 1.0.0
servers:
  - url: /api
    description: Local server
paths:
  /treks:
    get:
      summary: Get all treks
      responses:
        '200':
          description: A list of treks
    post:
      summary: Create a new trek
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
                difficulty:
                  type: string
                duration_days:
                  type: integer
                total_slots:
                  type: integer
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Trek created
  /treks/{id}:
    get:
      summary: Get a specific trek
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trek details
    put:
      summary: Update a trek
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Trek updated
    delete:
      summary: Delete a trek
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trek deleted
  /bookings:
    get:
      summary: Get all bookings
      responses:
        '200':
          description: A list of bookings
  /bookings/{id}:
    get:
      summary: Get booking details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking details
  /users:
    get:
      summary: Get all trekkers
      responses:
        '200':
          description: A list of users
